name: NixOS CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "**.diff"
      - "**.patch"

jobs:
  validate:
    name: Evaluate, build, and push to cache
    runs-on: nixos-ci
    container:
      image: lumilukko/nixos-ci:latest
      volumes:
        - nix-store:/nix

    env:
      CONFIG_FOLDER: "."
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        build-users-group =
        extra-platforms = aarch64-linux
        sandbox = false
        extra-substituters = ${{ vars.ATTIC_URL }}
        extra-trusted-public-keys = ${{ vars.ATTIC_PUBLIC_KEY }}
        netrc-file = /tmp/netrc-attic
    
    steps:
      - name: Configure cache credentials
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          set -eu
          umask 077
          printf 'machine 192.168.88.241 login attic-token password %s\n' \
            "$ATTIC_TOKEN" > /tmp/netrc-attic

          curl --fail --silent --show-error \
            --netrc-file /tmp/netrc-attic \
            http://192.168.88.241:8080/main/nix-cache-info
          nix store info --store http://192.168.88.241:8080/main --extra-experimental-features nix-command
      - name: Ensure CI tools are in the store
        run: nix build /opt/ci-tools-flake#default --out-link /opt/ci-tools
      - name: aarch64 smoke test
        run: |
          nix build --impure --no-link -L --expr \
          'let p = (builtins.getFlake "nixpkgs").legacyPackages; in p.aarch64-linux.runCommand "ci-arm-smoke-${toString builtins.currentTime}" {} "uname -m > $out; cat $out"'
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Nix
        run: |
          nix --version
          git --version
          nix flake metadata

      - name: Build NixOS host closures
        env:
          FORGEJO_TOKEN: ${{ secrets.TV_RELEASE_TOKEN }}
        run: |
          set -eu

          exclude="$(
            nix eval --raw .#lib.fleet.installerHosts \
              --apply 'l: builtins.concatStringsSep " " l'
          )"

          hosts="$(
            nix eval --raw .#nixosConfigurations \
              --apply 'a: builtins.concatStringsSep "\n" (builtins.attrNames a)'
          )"

          set --
          while IFS= read -r host; do
            [ -n "$host" ] || continue
            case " $exclude " in
              *" $host "*) echo "Skipping installer host ${host}"; continue ;;
            esac
            echo "Queueing ${host}"
            set -- "$@" ".#nixosConfigurations.${host}.config.system.build.toplevel"
          done <<EOF
          $hosts
          EOF

          if [ "$#" -eq 0 ]; then
            echo "ERROR: no hosts found" >&2
            exit 1
          fi

          nix build \
            --no-link \
            --print-out-paths \
            --keep-going \
            --max-jobs auto \
            "$@" \
            >> /tmp/out-paths

      - name: Build every exported x86_64-linux package
        run: |
          set -eu

          system=x86_64-linux

          packages="$(
            nix eval --raw \
              --apply "attrs: builtins.concatStringsSep \"\\n\" (builtins.filter (n: (attrs.\${n}.system or \"\") == \"${system}\") (builtins.attrNames attrs))" \
              ".#packages.${system}"
          )"

          if [ -z "$packages" ]; then
            echo "No packages exported for $system"
            exit 0
          fi

          set --
          while IFS= read -r package; do
            [ -n "$package" ] || continue
            set -- "$@" ".#packages.${system}.${package}"
          done <<EOF
          $packages
          EOF

          nix build \
            --no-link \
            --print-out-paths \
            --keep-going \
            --max-jobs auto \
            "$@" \
            >> /tmp/out-paths

      - name: Push to Attic
        if: always()
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          set -eu
          [ -s /tmp/out-paths ] || exit 0

          attic login ci-ip http://192.168.88.241:8080 "$ATTIC_TOKEN"
          xargs -r attic push ci-ip:main < /tmp/out-paths
      
      - name: Promote tested commit to stable
        if: success() && github.ref == 'refs/heads/master'
        env:
          TOKEN_FORGEJO: ${{ secrets.TOKEN_FORGEJO }}
        run: |
          set -eu

          # Configure authentication without embedding the token in the remote URL.
          auth="$(printf 'x-access-token:%s' "$TOKEN_FORGEJO" | base64 -w0)"
          git config http.https://git.lumilukko.com/.extraheader \
            "AUTHORIZATION: basic $auth"

          cleanup() {
            git config --unset-all \
              http.https://git.lumilukko.com/.extraheader || true
          }
          trap cleanup EXIT

          git push --force origin HEAD:refs/heads/stable
          
      - name: Notify on failure
        if: failure()
        env:
          WORKFLOW: ${{ github.workflow }}
          REPO: ${{ github.repository }}
          REF: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_number }}
        run: |
          curl --silent --show-error --fail \
            --connect-timeout 5 \
            --max-time 10 \
            -H "Title: ${WORKFLOW} failed" \
            -H "Priority: high" \
            -H "Tags: rotating_light" \
            -H "Click: ${RUN_URL}" \
            -d "${REPO}@${REF} ($(printf '%s' "$SHA" | cut -c1-8))" \
            https://ntfy.lumilukko.com/pipeline-failure \
            || echo "WARNING: failed to send ntfy notification" >&2