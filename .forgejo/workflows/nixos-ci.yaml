name: NixOS CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "**.diff"
      - "**.patch"

jobs:
  validate:
    name: Evaluate, build, and format
    runs-on: nixos-ci

    env:
      CONFIG_FOLDER: "."

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Nix
        run: |
          nix --version
          git --version
          nix flake metadata

      - name: Build NixOS host closures
        run: |
          nix build \
            --no-link \
            --keep-going \
            --max-jobs auto \
            .#nixosConfigurations.aria.config.system.build.toplevel \
            .#nixosConfigurations.raysha.config.system.build.toplevel \
            .#nixosConfigurations.talia.config.system.build.toplevel

      - name: Build every exported x86_64-linux package
        run: |
          set -eu

          system=x86_64-linux

          packages="$(
            nix eval --raw \
              --apply 'attrs: builtins.concatStringsSep "\n" (builtins.attrNames attrs)' \
              ".#packages.${system}"
          )"

          if [ -z "$packages" ]; then
            echo "No packages exported for $system"
            exit 0
          fi

          set --
          while IFS= read -r package; do
            [ -n "$package" ] || continue
            set -- "$@" ".#packages.${system}.${package}"
          done <<EOF
          $packages
          EOF

          nix build \
            --no-link \
            --keep-going \
            --max-jobs auto \
            "$@"