name: NixOS CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "**.diff"
      - "**.patch"

jobs:
  validate:
    name: Evaluate, build, and push to cache
    runs-on: nixos-ci

    env:
      CONFIG_FOLDER: "."
      NIX_CONFIG: |
        extra-substituters = ${{ vars.ATTIC_URL }}
        extra-trusted-public-keys = ${{ vars.ATTIC_PUBLIC_KEY }}
        netrc-file = /tmp/netrc-attic

    steps:
      - name: Configure cache credentials
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
          ATTIC_URL: ${{ vars.ATTIC_URL }}
        run: |
          host="${ATTIC_URL#*://}"; host="${host%%[:/]*}"
          umask 077
          printf 'machine %s password %s\n' "$host" "$ATTIC_TOKEN" > /tmp/netrc-attic

      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Nix
        run: |
          nix --version
          git --version
          nix flake metadata

      - name: Build NixOS host closures
        run: |
          nix build \
            --no-link \
            --print-out-paths \
            --keep-going \
            --max-jobs auto \
            .#nixosConfigurations.aria.config.system.build.toplevel \
            .#nixosConfigurations.raysha.config.system.build.toplevel \
            .#nixosConfigurations.talia.config.system.build.toplevel \
            >> /tmp/out-paths

      - name: Build every exported x86_64-linux package
        run: |
          set -eu

          system=x86_64-linux

          packages="$(
            nix eval --raw \
              --apply 'attrs: builtins.concatStringsSep "\n" (builtins.attrNames attrs)' \
              ".#packages.${system}"
          )"

          if [ -z "$packages" ]; then
            echo "No packages exported for $system"
            exit 0
          fi

          set --
          while IFS= read -r package; do
            [ -n "$package" ] || continue
            set -- "$@" ".#packages.${system}.${package}"
          done <<EOF
          $packages
          EOF

          nix build \
            --no-link \
            --print-out-paths \
            --keep-going \
            --max-jobs auto \
            "$@" \
            >> /tmp/out-paths

      - name: Push to Attic
        if: always()
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
          ATTIC_URL: ${{ vars.ATTIC_URL }}
        run: |
          [ -s /tmp/out-paths ] || exit 0
          server="${ATTIC_URL%/*}"      # http://aria.local:8080
          cache="${ATTIC_URL##*/}"      # main
          attic login ci "$server" "$ATTIC_TOKEN"
          xargs attic push "ci:$cache" < /tmp/out-paths