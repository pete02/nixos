name: NixOS CI

on:
  workflow_dispatch:
  push:
    branches:
      - master
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "**.diff"
      - "**.patch"

jobs:
  validate:
    name: Evaluate, build, and push to cache
    runs-on: nixos-ci
    container:
      image: lumilukko/nixos-ci:latest
      volumes:
        - nix-store:/nix

    env:
      CONFIG_FOLDER: "."
      NIX_CONFIG: |
        extra-substituters = ${{ vars.ATTIC_URL }}
        extra-trusted-public-keys = ${{ vars.ATTIC_PUBLIC_KEY }}
        netrc-file = /tmp/netrc-attic

    steps:
      - name: Configure cache credentials
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          set -eu
          umask 077
          printf 'machine 192.168.88.241 login attic-token password %s\n' \
            "$ATTIC_TOKEN" > /tmp/netrc-attic

          curl --fail --silent --show-error \
            --netrc-file /tmp/netrc-attic \
            http://192.168.88.241:8080/main/nix-cache-info
          nix store info --store http://192.168.88.241:8080/main


      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Nix
        run: |
          nix --version
          git --version
          nix flake metadata

      - name: Build NixOS host closures
        run: |
          nix build \
            --no-link \
            --print-out-paths \
            --keep-going \
            --max-jobs auto \
            .#nixosConfigurations.aria.config.system.build.toplevel \
            .#nixosConfigurations.raysha.config.system.build.toplevel \
            .#nixosConfigurations.talia.config.system.build.toplevel \
            >> /tmp/out-paths

      - name: Build every exported x86_64-linux package
        run: |
          set -eu

          system=x86_64-linux

          packages="$(
            nix eval --raw \
              --apply 'attrs: builtins.concatStringsSep "\n" (builtins.attrNames attrs)' \
              ".#packages.${system}"
          )"

          if [ -z "$packages" ]; then
            echo "No packages exported for $system"
            exit 0
          fi

          set --
          while IFS= read -r package; do
            [ -n "$package" ] || continue
            set -- "$@" ".#packages.${system}.${package}"
          done <<EOF
          $packages
          EOF

          nix build \
            --no-link \
            --print-out-paths \
            --keep-going \
            --max-jobs auto \
            "$@" \
            >> /tmp/out-paths

      - name: Push to Attic
        if: always()
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          set -eu
          [ -s /tmp/out-paths ] || exit 0

          attic login ci-ip http://192.168.88.241:8080 "$ATTIC_TOKEN"
          xargs -r attic push ci-ip:main < /tmp/out-paths
      
      - name: Promote tested commit to stable
        if: success() && github.ref == 'refs/heads/master'
        env:
          TOKEN_FORGEJO: ${{ secrets.TOKEN_FORGEJO }}
        run: |
          set -eu

          # Configure authentication without embedding the token in the remote URL.
          auth="$(printf 'x-access-token:%s' "$TOKEN_FORGEJO" | base64 -w0)"
          git config http.https://git.lumilukko.com/.extraheader \
            "AUTHORIZATION: basic $auth"

          cleanup() {
            git config --unset-all \
              http.https://git.lumilukko.com/.extraheader || true
          }
          trap cleanup EXIT

          git push --force-with-lease origin HEAD:refs/heads/stable