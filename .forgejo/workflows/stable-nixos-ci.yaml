name: NixOS Stable Publish

# Runs only when `stable` is pushed (by the master CI promote step).
# Deliberately no workflow_dispatch: this pipeline can't be started by hand.
on:
  push:
    branches:
      - stable

# Forgejo versions without `concurrency` support ignore this; the stale-head
# check in the publish step covers that case.
concurrency:
  group: stable-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Verify cache and publish deploy paths
    runs-on: nixos-ci
    container:
      image: lumilukko/nixos-ci:latest
      volumes:
        - nix-store:/nix

    env:
      CACHE_STORE: "http://192.168.88.241:8080/main"
      NIX_CONFIG: |
        experimental-features = nix-command flakes
        build-users-group =
        sandbox = false
        extra-substituters = ${{ vars.ATTIC_URL }}
        extra-trusted-public-keys = ${{ vars.ATTIC_PUBLIC_KEY }}
        netrc-file = /tmp/netrc-attic

    steps:
      - name: Configure cache credentials
        env:
          ATTIC_TOKEN: ${{ secrets.ATTIC_TOKEN }}
        run: |
          set -eu
          umask 077
          printf 'machine 192.168.88.241 login attic-token password %s\n' \
            "$ATTIC_TOKEN" > /tmp/netrc-attic

          curl --fail --silent --show-error \
            --netrc-file /tmp/netrc-attic \
            "$CACHE_STORE/nix-cache-info"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip if stable has moved on
        run: |
          set -eu
          head="$(git ls-remote origin refs/heads/stable | cut -f1)"
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "stable is now $head, not $GITHUB_SHA; a newer run will publish."
            echo "STALE=1" >> "$GITHUB_ENV"
          fi

      - name: Resolve and verify toplevels
        if: env.STALE != '1'
        run: |
          set -eu

          hosts="$(
            nix eval --raw .#nixosConfigurations \
              --apply 'a: builtins.concatStringsSep "\n" (builtins.attrNames a)'
          )"

          rm -rf /tmp/deploy-out
          mkdir -p /tmp/deploy-out/hosts

          while IFS= read -r host; do
            [ -n "$host" ] || continue

            path="$(
              nix eval --raw \
                ".#nixosConfigurations.${host}.config.system.build.toplevel.outPath"
            )"

            echo "Checking ${host}: ${path}"

            # Hard stop if CI never finished building/pushing this closure.
            if ! nix path-info --store "$CACHE_STORE" "$path" >/dev/null; then
              echo "ERROR: ${path} for ${host} is not in the cache" >&2
              exit 1
            fi

            printf '%s\n' "$path" > "/tmp/deploy-out/hosts/${host}"
          done <<EOF
          $hosts
          EOF

          echo "Resolved hosts:"
          ls /tmp/deploy-out/hosts

      - name: Publish to deploy branch
        if: env.STALE != '1'
        env:
          TOKEN_FORGEJO: ${{ secrets.TOKEN_FORGEJO }}
        run: |
          set -eu

          repo_url="$(git remote get-url origin)"
          src_sha="$GITHUB_SHA"

          auth="$(printf 'x-access-token:%s' "$TOKEN_FORGEJO" | base64 -w0)"
          git config --global http.https://git.lumilukko.com/.extraheader \
            "AUTHORIZATION: basic $auth"
          git config --global user.name "stable-publisher"
          git config --global user.email "stable-publisher@lumilukko.com"

          cleanup() {
            git config --global --unset-all \
              http.https://git.lumilukko.com/.extraheader || true
          }
          trap cleanup EXIT

          attempt=1
          while [ "$attempt" -le 3 ]; do
            work="$(mktemp -d)"

            if git ls-remote --exit-code --heads "$repo_url" deploy >/dev/null 2>&1; then
              git clone --quiet --branch deploy --single-branch "$repo_url" "$work/deploy"
            else
              echo "No deploy branch yet, creating an orphan one."
              git init --quiet -b deploy "$work/deploy"
              git -C "$work/deploy" remote add origin "$repo_url"
            fi

            cd "$work/deploy"

            # Replace the host files wholesale so removed hosts disappear too.
            rm -rf hosts
            mkdir -p hosts
            cp /tmp/deploy-out/hosts/* hosts/

            git add -A

            if git diff --cached --quiet; then
              echo "Deploy paths unchanged; nothing to publish."
              exit 0
            fi

            {
              echo "deploy: stable ${src_sha}"
              echo
              for f in hosts/*; do
                echo "$(basename "$f"): $(cat "$f")"
              done
            } > /tmp/commit-msg

            git commit --quiet -F /tmp/commit-msg

            # Never force: history on deploy is the audit trail.
            if git push origin HEAD:refs/heads/deploy; then
              echo "Published ${src_sha} to deploy."
              exit 0
            fi

            echo "Push rejected (attempt ${attempt}), retrying..." >&2
            attempt=$((attempt + 1))
            cd /
            sleep 3
          done

          echo "ERROR: failed to publish to deploy after retries" >&2
          exit 1