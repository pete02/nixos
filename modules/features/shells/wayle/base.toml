[bar]
scale = 0.75
padding = 0.15
padding-ends = 0.3
module-gap = 0.35

button-icon-padding = 0.6
button-label-padding = 0.4
button-gap = 0.6

button-group-padding = 0.0
button-group-module-gap = 0.2

[modules.clock]
format = "%a %b %d %H:%M"

[[bar.layout]]
monitor = "*"
left = ["dashboard", "hyprland-workspaces"]
center = ["media"]
right = [
    "volume",
    "netstat",
    "clock",
    "systray",
    "notifications",
    "network",
    "bluetooth",
]